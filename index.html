<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Mind Sort — Bubbles interaction study</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e5e7ed;color:#536179}
button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,.bubble:focus-visible{outline:2px solid #50aacd;outline-offset:4px}
.phone{--ink:#546477;--muted:#8594a8;--line:rgba(108,135,157,.20);--glass:rgba(255,255,255,.62);--btn:rgba(255,255,255,.70);--sky:radial-gradient(ellipse at 12% 25%,rgba(255,204,223,.44),transparent 43%),radial-gradient(ellipse at 92% 62%,rgba(144,205,245,.48),transparent 45%),radial-gradient(ellipse at 45% 88%,rgba(183,242,226,.33),transparent 50%),linear-gradient(155deg,#f9fcfc 0%,#f0f6f9 57%,#e9f1fa 100%);position:relative;width:min(402px,100vw);height:min(850px,100dvh);overflow:hidden;border:5px solid #1c2029;border-radius:44px;box-shadow:0 30px 100px #28344a33;isolation:isolate;background:#f7f9fb;color:var(--ink)}
.phone.dark{--ink:#f1f1fa;--muted:#a2acc0;--line:rgba(215,227,255,.14);--glass:rgba(14,20,37,.62);--btn:rgba(57,68,95,.56);--sky:radial-gradient(ellipse at 90% 20%,rgba(79,59,120,.60),transparent 46%),radial-gradient(ellipse at 6% 75%,rgba(27,95,137,.34),transparent 56%),radial-gradient(ellipse at 70% 83%,rgba(38,37,87,.55),transparent 50%),linear-gradient(150deg,#07111b,#0d192a 55%,#111126);background:#081522}
.sky{position:absolute;inset:0;background:var(--sky);pointer-events:none;transition:background .4s}.sky:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 53% 35%,rgba(255,255,255,.12),transparent 40%);opacity:.3}
.header{position:absolute;left:0;right:0;top:0;height:89px;padding:27px 20px 8px;z-index:5;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(241,249,255,.27),transparent)}
.brand{font-size:17px;letter-spacing:.02em;font-weight:680}.subtitle{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.07em;text-transform:uppercase}.header-actions{display:flex;gap:8px}
.ico{width:34px;height:34px;border-radius:18px;border:1px solid var(--line);background:var(--btn);color:var(--ink);display:grid;place-items:center;font-size:18px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.stage{position:absolute;left:0;right:0;top:88px;bottom:110px;touch-action:none;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;z-index:1;outline:none;will-change:left,top}.bubble:active{cursor:grabbing}.bubble.dragging{z-index:20}.bubble.nested{display:none}
.orb{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 55% 39% at 28% 21%,rgba(255,255,255,.86) 0%,rgba(255,255,255,.1) 46%,transparent 80%),radial-gradient(circle at 73% 73%,rgba(101,206,255,.28),transparent 39%),radial-gradient(circle at 29% 79%,rgba(235,112,203,.28),transparent 46%),conic-gradient(from 40deg at 50% 50%,rgba(105,223,240,.07),rgba(130,125,226,.16),rgba(239,153,196,.12),rgba(255,240,155,.11),rgba(131,228,241,.09));border:1.3px solid rgba(154,210,251,.77);box-shadow:inset 0 0 8px 2px rgba(255,255,255,.78),inset -6px -8px 16px rgba(141,129,210,.18),inset 6px 4px 13px rgba(121,234,249,.20),0 1px 3px rgba(82,127,178,.11),0 0 0 1px rgba(251,130,192,.15)}
.orb:before{content:"";position:absolute;inset:1px;border-radius:50%;pointer-events:none;background:conic-gradient(from 32deg,rgba(227,112,205,.1),rgba(112,215,251,.28) 16%,transparent 29%,rgba(255,201,105,.17) 42%,rgba(246,95,195,.28) 52%,transparent 67%,rgba(96,204,255,.32) 82%,rgba(250,131,197,.19) 97%);mask:radial-gradient(circle,transparent 62%,black 97%);-webkit-mask:radial-gradient(circle,transparent 62%,black 97%)}
.orb:after{content:"";position:absolute;width:53%;height:17%;left:10%;top:10%;transform:rotate(-29deg);border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.03));filter:blur(2px)}
.dark .orb{background:radial-gradient(ellipse 55% 37% at 24% 16%,rgba(255,255,255,.58),rgba(255,255,255,.0) 70%),radial-gradient(circle at 75% 65%,rgba(70,162,255,.46),transparent 43%),radial-gradient(circle at 19% 79%,rgba(255,101,214,.48),transparent 45%),radial-gradient(circle at 50% 49%,rgba(98,92,196,.22),rgba(154,238,250,.06) 70%);border:1.4px solid rgba(127,209,255,.80);box-shadow:inset 0 0 12px rgba(236,228,255,.31),inset -8px -7px 20px rgba(116,52,220,.32),inset 7px 5px 17px rgba(24,183,242,.27),0 2px 18px rgba(16,83,151,.18)}
.bubble-inner{width:100%;height:100%;animation:breathe var(--float-time,5s) ease-in-out infinite alternate}.bubble.dragging .bubble-inner{animation:none}
@keyframes breathe{0%{transform:translate3d(0,2px,0) rotate(-1deg)}100%{transform:translate3d(2px,-3px,0) rotate(1deg)}}
.orb-text{position:absolute;z-index:2;inset:20% 14%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;overflow:hidden;line-height:1.22;font-weight:520;overflow-wrap:anywhere;pointer-events:none;color:#607087;text-shadow:0 1px 2px rgba(255,255,255,.9)}
.dark .orb-text{color:#f8f8ff;text-shadow:0 1px 5px rgba(14,15,54,.8)}
.bubble.small .orb-text{inset:25% 15%;opacity:.85}.bubble.dragging .orb{box-shadow:inset 0 0 15px rgba(255,255,255,.3),0 0 0 3px rgba(127,195,245,.28),0 12px 35px #243a5a23}
.group-dot{position:absolute;right:3px;bottom:3px;min-width:19px;height:19px;border-radius:12px;padding:0 4px;background:rgba(255,255,255,.8);color:#6073a0;z-index:5;display:grid;place-items:center;font-size:10px;box-shadow:0 1px 6px #354b6433}.dark .group-dot{background:rgba(32,42,76,.8);color:#fff}
.grouping-target .orb{outline:3px solid rgba(104,196,246,.8);outline-offset:4px}
.footer{position:absolute;z-index:5;left:0;right:0;bottom:0;height:110px;padding:9px 18px 20px;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.controls{display:flex;align-items:center;justify-content:space-between}.foot-note{font-size:10px;color:var(--muted);max-width:204px;line-height:1.6}.foot-actions{display:flex;align-items:center;gap:8px}.add{height:46px;width:46px;border-radius:25px;border:1px solid rgba(159,209,238,.48);background:radial-gradient(circle at 23% 18%,#fff,rgba(183,224,248,.72) 67%,rgba(242,193,224,.62));color:#487894;font-size:28px;line-height:1;box-shadow:0 3px 14px #86adc735}
.footer-stat{font-size:10px;color:var(--muted);margin-top:5px}
.focus{position:absolute;inset:86px 0 0;z-index:7;background:var(--sky);display:none;overflow:hidden}.focus.visible{display:block}.focus-top{display:flex;justify-content:space-between;align-items:center;padding:0 19px;height:48px;position:relative;z-index:4}.focus .focus-center{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:min(77vw,310px);aspect-ratio:1;max-width:310px}.focus .focus-center .orb{box-shadow:inset 0 0 20px rgba(255,255,255,.62),inset -10px -11px 28px rgba(124,113,203,.26),0 14px 42px rgba(54,82,137,.12)}.focus .focus-center .orb-text{font-size:19px!important;line-height:1.36;inset:17% 17%}
.focus-meta{position:absolute;top:calc(34% + min(40vw,160px));left:20px;right:20px;display:grid;gap:10px;justify-items:center;z-index:2}
.pill{border:1px solid var(--line);border-radius:24px;padding:9px 16px;background:var(--btn);color:var(--ink);backdrop-filter:blur(9px)}.pop{background:linear-gradient(110deg,#aadff0,#f2badb);color:#344d69;border:0;font-weight:700;box-shadow:0 3px 14px #7690af22;padding:12px 24px}.focus-desc{max-width:320px;text-align:center;font-size:11px;color:var(--muted)}
.focus-dock{position:absolute;left:10px;right:10px;bottom:23px;overflow-x:auto;display:flex;align-items:center;gap:14px;padding:15px 10px 9px;scrollbar-width:thin}.mini{display:block;flex:0 0 auto;border-radius:50%;border:1px solid rgba(188,216,248,.8);height:43px;width:43px;box-shadow:inset 0 0 9px rgba(170,195,250,.35);background:radial-gradient(circle at 28% 20%,#fff,rgba(159,230,248,.25) 40%,rgba(241,157,213,.3) 75%,rgba(121,169,248,.4));cursor:pointer}.mini.selected{outline:2px solid #7dd6f3;outline-offset:3px}.mini-caption{display:block;max-width:75px;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);text-align:center;margin-top:6px}
.modal-cover{position:absolute;inset:0;z-index:12;background:rgba(8,17,31,.27);display:none;align-items:flex-end;justify-content:center}.modal-cover.show{display:flex}.sheet{width:100%;border-radius:24px 24px 0 0;padding:23px 23px 38px;background:rgba(247,250,255,.98);color:#3b506a;box-shadow:0 -12px 40px #162b4a20}.dark .sheet{background:#1d253b;color:#edf0fb}.sheet h3{margin:0 0 9px;font-size:17px}.sheet p{font-size:12px;line-height:1.5;opacity:.8}.sheet textarea{width:100%;min-height:78px;resize:vertical;border:1px solid #cddce8;border-radius:12px;padding:11px;outline:none;background:#fff;color:#32435a}.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sheet-actions button{border:1px solid #cedae8;background:#eef5fa;color:#3b5770;padding:11px 14px;border-radius:12px;font-size:13px}.sheet-actions button.primary{background:#bce4ef;border-color:#bce4ef;font-weight:680;color:#274d69}
.toast{position:absolute;z-index:20;left:18px;right:18px;bottom:118px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;background:rgba(27,43,63,.92);color:white;box-shadow:0 7px 30px #00102038;font-size:12px}.toast.visible{display:flex}.toast button{color:#9ee8fa;background:none;border:0;font-weight:700}
.burst{pointer-events:none;position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center}.burst.show{display:flex}.burst-ring{width:60vw;max-width:300px;aspect-ratio:1;border:5px solid rgba(132,213,245,.75);border-radius:50%;animation:burstring .55s ease-out both;box-shadow:0 0 16px rgba(243,160,219,.62)}
@keyframes burstring{0%{transform:scale(.77);opacity:1}85%{opacity:.8}100%{transform:scale(1.6);opacity:0}}
@media (max-width:500px){body{display:block;background:transparent}.phone{border:0;border-radius:0;width:100vw;height:100dvh;box-shadow:none}.focus .focus-center{width:min(76vw,305px)}}
@media (prefers-reduced-motion:reduce){.bubble-inner{animation:none!important}.burst-ring{animation-duration:.1s}}

/* Subtle living surface motion without scaling the task label */
.bubble:not(.dragging) .orb:before{animation:filmDrift 9s linear infinite alternate}
@keyframes filmDrift{from{transform:rotate(-9deg);filter:hue-rotate(-8deg)}to{transform:rotate(12deg);filter:hue-rotate(18deg)}}
@media(prefers-reduced-motion:reduce){.bubble-inner,.bubble .orb:before{animation:none!important}}

/* Physics study 03: increased organic motion and forgiving hit zones. */
.bubble::after{content:"";position:absolute;inset:-13px;border-radius:50%;z-index:3;background:transparent;touch-action:none}
.bubble:not(.dragging) .bubble-inner{animation:alive 2.9s ease-in-out infinite alternate}
@keyframes alive{0%{transform:translate3d(-6px,5px,0) scale(.965) rotate(-4deg)}100%{transform:translate3d(7px,-7px,0) scale(1.045) rotate(4deg)}}
.bubble:not(.dragging) .orb:before{animation:filmDrift 3.2s linear infinite alternate}
@media(prefers-reduced-motion:reduce){.bubble-inner,.bubble .orb:before{animation:none!important}}

/* Independent natural animation timing for each object. */
.bubble:not(.dragging) .bubble-inner{animation:alive var(--float-time,3.2s) ease-in-out infinite alternate;animation-delay:var(--phase,0s)}
@keyframes alive{
  0%{transform:translate3d(calc(var(--drift-x,3px) * -.8),calc(var(--drift-y,3px) * -.8),0) scale(.965) rotate(calc(var(--swing,3deg) * -1))}
  100%{transform:translate3d(var(--drift-x,3px),var(--drift-y,3px),0) scale(1.045) rotate(var(--swing,3deg))}
}
.bubble:not(.dragging) .orb:before{animation:filmDrift calc(var(--float-time,3s) * 1.3) linear infinite alternate;animation-delay:var(--phase,0s)}
@media(prefers-reduced-motion:reduce){.bubble-inner,.bubble .orb:before{animation:none!important}}

/* Separate idle orbit from spring: spring only animates the membrane, never the orbit wrapper. */
.bubble .orb{transform-origin:center;}
.bubble .bubble-inner{animation-play-state:running}
.bubble:active .bubble-inner{animation-play-state:paused}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="sky"></div>
<header class="header"><div><div class="brand">mind sort <span style="font-weight:300;opacity:.6">/ bubbles</span></div><div class="subtitle">интерактивный эскиз · 01</div></div><div class="header-actions"><button class="ico" id="sound" title="Звук вкл/выкл">♪</button><button class="ico" id="theme" title="Сменить свет/темноту">☾</button></div></header>
<main class="stage" id="stage" aria-label="Пространство задач"></main>
<footer class="footer"><div class="controls"><div class="foot-note">Перетащи пузырь.<br>Коснись — открыть.<br>Щипок или колёсико — изменить размер.</div><div class="foot-actions"><button class="ico" id="archive" title="Выполненные задачи">✓</button><button class="add" id="add" title="Создать задачу">+</button></div></div><div class="footer-stat" id="stat"></div></footer>
<section class="focus" id="focus" aria-label="Выбранная задача"><div class="focus-top"><button class="ico" id="back" aria-label="Назад">‹</button><div style="font-size:11px;color:var(--muted)">Выбранная задача</div><button class="ico" id="edit" title="Изменить текст">✎</button></div><div class="focus-center" id="focusCenter"></div><div class="focus-meta" id="focusMeta"></div><div class="focus-dock" id="focusDock"></div></section>
<div class="burst" id="burst"><div class="burst-ring"></div></div>
<div class="modal-cover" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo">Отменить</button></div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'), phone=$('phone');
let tasks=[
 {id:1,title:'Приложение: эскиз, примеры, сделать схему',x:29,y:27,size:146,done:false},
 {id:2,title:'Налоговая: отчёт',x:75,y:16,size:80,done:false},
 {id:3,title:'Записаться к врачу',x:62,y:34,size:65,done:false},
 {id:4,title:'Сделать платёж, проверить и отметить в таблице',x:69,y:64,size:116,done:false},
 {id:5,title:'Написать клиенту',x:20,y:71,size:76,done:false},
 {id:6,title:'Подготовить материалы',x:39,y:83,size:69,done:false},
 {id:7,title:'Проверить расписание',x:22,y:49,size:52,done:false}
];
let focusId=null, gest=null, groupCount=1, pending=null, lastCompleted=null, toastTimer=null, soundEnabled=true;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const get=id=>tasks.find(t=>t.id===id);
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function textForBubble(t){return t.size<65?'···':escapeHTML(t.title)}
function render(){stage.innerHTML='';for(const t of tasks){if(t.done||t.parentId)continue;let div=document.createElement('div');div.className='bubble'+(t.size<65?' small':'');div.dataset.id=t.id;div.tabIndex=0;div.setAttribute('role','button');div.setAttribute('aria-label',t.title);div.style.left=t.x+'%';div.style.top=t.y+'%';div.style.width=t.size+'px';div.style.height=t.size+'px';div.style.setProperty('--float-time',(2.4+(Math.sin(t.id*17.13)*.5+.5)*2.2)+'s');
div.style.setProperty('--phase',(-((t.id*2.731)%7.8))+'s');
div.style.setProperty('--drift-x',(Math.sin(t.id*2.13)*9).toFixed(2)+'px');
div.style.setProperty('--drift-y',(Math.cos(t.id*3.71)*9).toFixed(2)+'px');
div.style.setProperty('--swing',(Math.sin(t.id*4.3)*5).toFixed(2)+'deg');let groupNum=tasks.filter(o=>!o.done&&o.groupId&&o.groupId===t.groupId).length;let children=tasks.filter(o=>!o.done&&o.parentId===t.id).length;div.innerHTML=`<div class="bubble-inner"><div class="orb"><span class="orb-text" style="font-size:${clamp(t.size*.095,9,15)}px">${textForBubble(t)}</span></div></div>${children?`<span class="group-dot">${children} ↳</span>`:groupNum>1?`<span class="group-dot">${groupNum}</span>`:''}`;
 div.addEventListener('pointerdown',onDown);div.addEventListener('pointermove',onMove);div.addEventListener('pointerup',onUp);div.addEventListener('pointercancel',onCancel);div.addEventListener('wheel',onWheel,{passive:false});div.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFocus(t.id)}});stage.appendChild(div);
} $('stat').textContent=`${tasks.filter(t=>!t.done).length} активных · ${tasks.filter(t=>t.done).length} выполненных`;}
/* Unified pointer tracking: touch targets are found by proximity, not DOM hitboxes. */
const contacts=new Map();let gesture=null;
function chooseBubble(x,y){
 const rect=stage.getBoundingClientRect(),px=x-rect.left,py=y-rect.top;
 let closest=null,best=Infinity;
 for(const t of liveObjects()){
  const d=Math.hypot(px-t.x*rect.width/100,py-t.y*rect.height/100);
  const reach=Math.max(t.size/2+22,39);
  if(d<=reach && d/Math.max(t.size/2,25)<best){best=d/Math.max(t.size/2,25);closest=t;}
 }
 return closest;
}
function beginContact(e){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(e.target.closest('.header,.footer,.focus,.modal'))return;
 const t=chooseBubble(e.clientX,e.clientY);if(!t)return;
 e.preventDefault();stage.setPointerCapture(e.pointerId);
 contacts.set(e.pointerId,{id:t.id,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});
 if(contacts.size===1){gesture={mode:'single',id:t.id,origin:{x:t.x,y:t.y},moved:false};return;}
 if(contacts.size===2){
  const [p,q]=[...contacts.values()];
  const distance=Math.max(1,Math.hypot(p.x-q.x,p.y-q.y));
  if(p.id===q.id){const current=get(p.id);gesture={mode:'pinch',id:p.id,base:current.size,distance,moved:true};}
  else{gesture={mode:'pair',ids:[p.id,q.id],initial:{[p.id]:{x:get(p.id).x,y:get(p.id).y},[q.id]:{x:get(q.id).x,y:get(q.id).y}},startDist:distance,moved:false};}
 }
}
function updateContact(e){
 const p=contacts.get(e.pointerId);if(!p||!gesture)return;
 p.x=e.clientX;p.y=e.clientY;
 const rect=stage.getBoundingClientRect(),w=rect.width,h=rect.height;
 if(gesture.mode==='pinch'&&contacts.size===2){
  const [a,b]=[...contacts.values()],t=get(gesture.id);
  const d=Math.hypot(a.x-b.x,a.y-b.y);
  t.size=clamp(gesture.base*d/gesture.distance,45,194);
  const el=stage.querySelector('[data-id="'+t.id+'"]');
  if(el){el.style.width=t.size+'px';el.style.height=t.size+'px';el.querySelector('.orb-text').style.fontSize=clamp(t.size*.095,9,15)+'px';}
  pushNeighbors(t,12);return;
 }
 if(gesture.mode==='single'){
  const t=get(gesture.id);
  if(!t)return;
  const original=[...contacts.values()][0];
  if(Math.hypot(original.x-original.startX,original.y-original.startY)>6)gesture.moved=true;
  if(!gesture.moved)return;
  const dx=(original.x-original.startX)/w*100,dy=(original.y-original.startY)/h*100;
  const group=t.groupId?liveObjects().filter(o=>o.groupId===t.groupId):[t];
  for(const member of group){
   if(!gesture.groupStart)gesture.groupStart={};
   if(!gesture.groupStart[member.id])gesture.groupStart[member.id]={x:member.x,y:member.y};
   const pos=gesture.groupStart[member.id];
   member.x=pos.x+dx;member.y=pos.y+dy;
  }
  pushNeighbors(t,10);return;
 }
 if(gesture.mode==='pair'&&contacts.size===2){
  let moved=false;
  for(const c of contacts.values()){
   const t=get(c.id),o=gesture.initial[c.id];if(!t)continue;
   if(Math.hypot(c.x-c.startX,c.y-c.startY)>6)moved=true;
   t.x=o.x+(c.x-c.startX)/w*100;t.y=o.y+(c.y-c.startY)/h*100;
  }
  gesture.moved ||= moved;
  // Pair contact is intentional; the selected pair may overlap, but other bubbles repel.
  for(const id of gesture.ids){const t=get(id),el=stage.querySelector('[data-id="'+id+'"]');if(el){el.style.left=t.x+'%';el.style.top=t.y+'%';}}
 }
}
function finishContact(e){
 const p=contacts.get(e.pointerId);if(!p)return;
 contacts.delete(e.pointerId);
 if(contacts.size>0)return;
 const g=gesture;gesture=null;if(!g)return;
 if(g.mode==='pinch'){settlePhysics(g.id);return;}
 if(g.mode==='single'){if(g.moved)settlePhysics(g.id);else openFocus(g.id);return;}
 if(g.mode==='pair'){
  const a=get(g.ids[0]),b=get(g.ids[1]),rect=stage.getBoundingClientRect();
  if(a&&b){
   const distance=Math.hypot((a.x-b.x)*rect.width/100,(a.y-b.y)*rect.height/100);
   const threshold=(a.size+b.size)/2+12;
   if(distance<threshold&&g.moved){
    const group=a.groupId||b.groupId||('g'+groupCount++);
    a.groupId=group;b.groupId=group;
    toastMsg('Пузыри соединены · перемещаются вместе',false);
   }
   // Hold two members of one group and pull them apart to separate.
   else if(a.groupId&&a.groupId===b.groupId && distance>threshold+26){
    b.groupId=null;toastMsg('Пузыри разъединены',false);
   }
   // Avoid pair overlap once the gesture ends, except for joined objects.
   pushNeighbors(a,20);
  }
  render();
 }
}
function onDown(e){}function onMove(e){}function onUp(e){}function onCancel(e){}
stage.addEventListener('pointerdown',beginContact,true);
stage.addEventListener('pointermove',updateContact);
stage.addEventListener('pointerup',finishContact);
stage.addEventListener('pointercancel',finishContact);
function onWheel(e){e.preventDefault();const t=get(Number(e.currentTarget.dataset.id));t.size=clamp(t.size+(e.deltaY<0?8:-8),45,194);render();}
function overlapTarget(t){const rect=stage.getBoundingClientRect();let best=null,depth=0;for(const other of tasks){if(other.id===t.id||other.done||other.parentId)continue;const distance=Math.hypot((other.x-t.x)*rect.width/100,(other.y-t.y)*rect.height/100);const actualOverlap=(other.size+t.size)/2-distance;if(actualOverlap>Math.min(other.size,t.size)*.05&&actualOverlap>depth){best=other;depth=actualOverlap}}return best;}
function showAttach(){const a=get(pending.id),b=get(pending.targetId);showSheet(`<h3>Пузыри соприкоснулись</h3><p>«${escapeHTML(a.title)}» и «${escapeHTML(b.title)}». Что это означает?</p><div class="sheet-actions"><button class="primary" data-act="join">Склеить в группу</button><button data-act="nest">Сделать подзадачей</button><button data-act="cancel">Оставить отдельно</button></div>`,(act)=>{if(act==='cancel'){hideSheet();render();return;}if(act==='join'){let g=b.groupId||a.groupId||('g'+groupCount++);a.groupId=g;b.groupId=g;positionNear(a,b);toastMsg('Пузыри соединены',true)}else if(act==='nest'){a.parentId=b.id;a.groupId=null;toastMsg('Задача помещена внутрь другой',true)}pending=null;hideSheet();render();});}
function positionNear(a,b){const rect=stage.getBoundingClientRect();const dx=(a.x-b.x)*rect.width/100,dy=(a.y-b.y)*rect.height/100,angle=Math.atan2(dy,dx),dist=(a.size+b.size)*.40;a.x=clamp(b.x+Math.cos(angle)*dist/rect.width*100,8,92);a.y=clamp(b.y+Math.sin(angle)*dist/rect.height*100,8,92)}
function openFocus(id){focusId=id;renderFocus();$('focus').classList.add('visible');}
function renderFocus(){const t=get(focusId);if(!t||t.done){closeFocus();return;}let childCount=tasks.filter(c=>!c.done&&c.parentId===t.id).length;
 $('focusCenter').innerHTML=`<div class="orb"><span class="orb-text">${escapeHTML(t.title)}</span></div>`;
 $('focusMeta').innerHTML=`${childCount?`<div class="focus-desc">Внутри: ${childCount} подзадач · коснись маленького пузыря внизу</div>`:''}<button class="pill pop" id="complete">Лопнуть · выполнено</button><div class="focus-desc">Завершение сохраняется в истории, действие можно отменить.</div>`;
 $('complete').onclick=()=>completeTask(t.id);
 const others=tasks.filter(o=>!o.done&&o.id!==t.id&&(o.parentId===t.id||!o.parentId));$('focusDock').innerHTML='';for(const o of others){let item=document.createElement('div');item.style.flex='0 0 auto';item.innerHTML=`<button class="mini" title="${escapeHTML(o.title)}"></button><span class="mini-caption">${escapeHTML(o.title)}</span>`;item.querySelector('button').onclick=()=>openFocus(o.id);$('focusDock').appendChild(item);}}
function closeFocus(){focusId=null;$('focus').classList.remove('visible');render();}
function playPop(){if(soundEnabled){try{const C=window.AudioContext||window.webkitAudioContext;if(C){const ctx=new C(),osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(360,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(105,ctx.currentTime+.12);g.gain.setValueAtTime(.14,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.18);osc.onended=()=>ctx.close();}}catch(e){}}if(navigator.vibrate)navigator.vibrate(22)}
function completeTask(id){const t=get(id);if(!t||t.done)return;playPop();$('burst').classList.add('show');lastCompleted=id;window.setTimeout(()=>{$('burst').classList.remove('show');t.done=true;closeFocus();toastMsg('Задача выполнена',true)},430)}
function toastMsg(msg,canUndo=false){clearTimeout(toastTimer);$('toastText').textContent=msg;$('undo').style.display=canUndo?'inline':'none';$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),5800)}
$('undo').onclick=()=>{if(lastCompleted){const t=get(lastCompleted);if(t)t.done=false;lastCompleted=null;$('toast').classList.remove('visible');render()}};
function showSheet(html,action){$('sheet').innerHTML=html;$('modal').classList.add('show');$('sheet').querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>action(x.dataset.act));}
function hideSheet(){$('modal').classList.remove('show')}
function addOrEdit(t){let edit=!!t;showSheet(`<h3>${edit?'Изменить задачу':'Новая задача'}</h3><p>Одно действие — один пузырь. Остальные детали добавим позже.</p><textarea id="taskTitle" placeholder="Что нужно сделать?">${edit?escapeHTML(t.title):''}</textarea><div class="sheet-actions"><button class="primary" data-act="save">${edit?'Сохранить':'Создать пузырь'}</button><button data-act="cancel">Отмена</button></div>`,(act)=>{if(act==='cancel'){hideSheet();return}let v=$('taskTitle').value.trim();if(!v)return;if(edit){t.title=v;renderFocus()}else{const id=Math.max(0,...tasks.map(t=>t.id))+1;tasks.push({id,title:v,x:50+Math.random()*20-10,y:40+Math.random()*20-10,size:94,done:false});toastMsg('Новый пузырь создан',false)}hideSheet();render();});setTimeout(()=>$('taskTitle')?.focus(),50)}
$('add').onclick=()=>addOrEdit();$('edit').onclick=()=>addOrEdit(get(focusId));$('back').onclick=closeFocus;
$('theme').onclick=()=>{phone.classList.toggle('dark');$('theme').textContent=phone.classList.contains('dark')?'☀':'☾'};
$('sound').onclick=()=>{soundEnabled=!soundEnabled;$('sound').textContent=soundEnabled?'♪':'×';toastMsg(soundEnabled?'Звук включён':'Звук выключен',false)};
$('archive').onclick=()=>{let done=tasks.filter(t=>t.done);showSheet(`<h3>Выполнено: ${done.length}</h3>${done.length?'<p>'+done.map(t=>'✓ '+escapeHTML(t.title)).join('<br>')+'</p>':'<p>Пока пусто. Лопни первый пузырь после выполнения задачи.</p>'}<div class="sheet-actions"><button class="primary" data-act="close">Закрыть</button></div>`,hideSheet)};
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))hideSheet()});

/* Mind Sort / physical layout study 02 */
let layoutMode='free', settling=0;
function liveObjects(){return tasks.filter(o=>!o.done&&!o.parentId)}
function pushNeighbors(active,iterations=12){
 const a=liveObjects(),rect=stage.getBoundingClientRect(),w=rect.width,h=rect.height;
 const margin=5;
 const confine=p=>{
  const radius=p.size/2+margin;
  const x=Math.min(w-radius,Math.max(radius,p.x*w/100));
  const y=Math.min(h-radius,Math.max(radius,p.y*h/100));
  const changed=Math.abs(x-p.x*w/100)+Math.abs(y-p.y*h/100)>.01;
  p.x=x/w*100;p.y=y/h*100;return changed;
 };
 // Boundaries are constraints for every body, not just the dragged one.
 for(const p of a)confine(p);
 for(let k=0;k<iterations;k++){
  let movement=false;
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
   const p=a[i],q=a[j];
   let dx=(q.x-p.x)*w/100,dy=(q.y-p.y)*h/100;
   let d=Math.hypot(dx,dy);
   if(d<.001){const ang=((p.id*19+q.id*31)%360)*Math.PI/180;dx=Math.cos(ang);dy=Math.sin(ang);d=1;}
   if(p.groupId&&p.groupId===q.groupId)continue;
   const minimum=(p.size+q.size)/2+5;
   if(d>=minimum-.1)continue;
   const nx=dx/d,ny=dy/d,overlap=minimum-d;
   // A constrained neighbour may not move outwards; the other sphere must give way.
   const pLeft=p.x*w/100-(p.size/2+margin),pRight=w-(p.x*w/100+p.size/2+margin);
   const pTop=p.y*h/100-(p.size/2+margin),pBottom=h-(p.y*h/100+p.size/2+margin);
   const qLeft=q.x*w/100-(q.size/2+margin),qRight=w-(q.x*w/100+q.size/2+margin);
   const qTop=q.y*h/100-(q.size/2+margin),qBottom=h-(q.y*h/100+q.size/2+margin);
   const capacityP=Math.min(nx>0?pLeft:pRight,ny>0?pTop:pBottom);
   const capacityQ=Math.min(nx>0?qRight:qLeft,ny>0?qBottom:qTop);
   let wp=p.id===active.id?0:q.id===active.id?1:.5;
   if(capacityP<overlap*wp)wp=Math.max(0,Math.min(1,capacityP/Math.max(overlap,.001)));
   if(capacityQ<overlap*(1-wp))wp=Math.max(wp,1-capacityQ/Math.max(overlap,.001));
   wp=Math.min(1,Math.max(0,wp));
   const wq=1-wp;
   p.x-=nx*overlap*wp/w*100;p.y-=ny*overlap*wp/h*100;
   q.x+=nx*overlap*wq/w*100;q.y+=ny*overlap*wq/h*100;
   confine(p);confine(q);movement=true;
  }
  if(!movement)break;
 }
 for(const t of a){const n=stage.querySelector('[data-id="'+t.id+'"]');if(n){n.style.left=t.x+'%';n.style.top=t.y+'%'}}
}
function bounce(el){
 if(!el)return;
 const core=el.querySelector('.bubble-inner');if(!core)return;
 // Finish the 5% overshoot before returning to idle motion.
 core.style.animation='none';
 const anim=core.animate([{transform:'scale(1)',offset:0},{transform:'scale(1.05)',offset:.38},{transform:'scale(1)',offset:1}],{duration:530,easing:'cubic-bezier(.24,.7,.27,1)',fill:'forwards'});
 anim.onfinish=()=>anim.cancel();
}
function renderLater(){setTimeout(()=>render(),600)}
function settlePhysics(id){
 const el=stage.querySelector('[data-id="'+id+'"]');bounce(el);
 let n=0;cancelAnimationFrame(settling);
 function step(){const active=get(id);if(!active)return;
  pushNeighbors(active,5);
  if(++n<34)settling=requestAnimationFrame(step);
 }
 settling=requestAnimationFrame(step);
}
const gridButton=document.createElement('button');
gridButton.className='ico';gridButton.textContent='▦';gridButton.title='Сетка / свободное расположение';
gridButton.setAttribute('aria-label','Сетка или свободное расположение');
document.querySelector('.header-actions').prepend(gridButton);
const freePositions=new Map();
gridButton.addEventListener('click',()=>{
 const objects=liveObjects(),rect=stage.getBoundingClientRect();
 if(layoutMode==='free'){
  objects.forEach(t=>freePositions.set(t.id,{x:t.x,y:t.y,size:t.size}));
  layoutMode='grid';gridButton.textContent='◌';
  const cols=3,diameter=Math.min(92,(rect.width-35)/cols-8);
  objects.forEach((t,i)=>{t.size=diameter;t.x=(i%cols+.5)*100/cols;t.y=clamp((Math.floor(i/cols)+.5)*(diameter+10)/rect.height*100,9,93)});
 }else{
  layoutMode='free';gridButton.textContent='▦';
  objects.forEach(t=>{const saved=freePositions.get(t.id);if(saved)Object.assign(t,saved)});
 }
 render();toastMsg(layoutMode==='grid'?'Ровная сетка':'Свободное пространство',false);
});

render();
})();
